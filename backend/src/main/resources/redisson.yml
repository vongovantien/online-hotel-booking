# Redisson configuration — single-server mode
# Spring Boot auto-detects this file when redisson-spring-boot-starter is on classpath
singleServerConfig:
  address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
  connectionMinimumIdleSize: 2
  connectionPoolSize: 10
  idleConnectionTimeout: 10000
  connectTimeout: 10000
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500

threads: 0        # 0 = use available CPU cores
nettyThreads: 0

codec: !<org.redisson.codec.JsonJacksonCodec> {}
transportMode: "NIO"
