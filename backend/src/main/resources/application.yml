server:
  port: 8080
  # Virtual Threads: Tomcat uses a virtual thread per request (Java 21 / Project Loom)
  tomcat:
    threads:
      virtual:
        enabled: true

spring:
  threads:
    virtual:
      enabled: true   # enables virtual threads for @Async and Spring task executor

  datasource:
    url: jdbc:postgresql://${DB_HOST:10.77.0.11}:${DB_PORT:31221}/${DB_NAME:tienvo}?sslmode=prefer&sslfactory=org.postgresql.ssl.NonValidatingFactory&prepareThreshold=0
    username: ${DB_USER:sp-user}
    password: ${DB_PASSWORD:kxxMJPYGQ([-Pbi*@Iuji-uW}
    driver-class-name: org.postgresql.Driver
    hikari:
      # With virtual threads, a smaller pool is sufficient — VTs are cheap and park instead of block
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redisson replaces spring.data.redis — configured via redisson.yml
  # (spring.data.redis.* is intentionally absent)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
